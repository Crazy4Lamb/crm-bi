name: crm-bi
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${PGADMIN_USER:-crm_owner}
      POSTGRES_PASSWORD: ${PGADMIN_PASSWORD:?Run npm run setup to generate .env}
      POSTGRES_DB: ${PGDATABASE:-crm_bi}
      CRM_APP_USER: ${PGUSER:-crm_app}
      CRM_APP_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      TZ: ${APP_TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30
    shm_size: 128mb
volumes:
  postgres_data:

